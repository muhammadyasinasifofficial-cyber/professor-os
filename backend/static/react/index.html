<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProfessorOS – OBE Assessment & Accreditation Hub</title>
  <!-- Tailwind CSS 3.4 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM & Babel CDN for zero-build execution -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const API_BASE = "/api/v1";

    // ── Pre-configured Tokens for Instant Demo ──
    const DEMO_PROF_TOKEN = localStorage.getItem("token") || "";

    function App() {
      const [activeTab, setActiveTab] = useState("builder");
      const [courseId, setCourseId] = useState(4);
      const [token, setToken] = useState(DEMO_PROF_TOKEN);
      const [loginLoading, setLoginLoading] = useState(false);

      const autoLoginProfessor = async () => {
        setLoginLoading(true);
        try {
          const res = await fetch(`${API_BASE}/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: "dr.tariq@professoros.edu.pk", password: "professor123" }),
          });
          const data = await res.json();
          if (res.ok && data.access_token) {
            localStorage.setItem("token", data.access_token);
            setToken(data.access_token);
            alert("Authenticated as Dr. Tariq Mahmood (Professor role)!");
          } else {
            alert("Login failed: " + (data.detail || "Check backend status"));
          }
        } catch (e) {
          alert("Could not reach backend on " + API_BASE);
        } finally {
          setLoginLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Demo Navigation Bar */}
          <nav className="bg-slate-900 text-white px-6 py-3 border-b border-slate-800 flex flex-wrap items-center justify-between gap-4 shadow-md">
            <div className="flex items-center gap-3">
              <span className="bg-indigo-600 text-white font-bold px-2.5 py-1 rounded text-sm tracking-wider">
                ProfessorOS
              </span>
              <span className="text-xs text-slate-400 font-medium hidden sm:inline">
                Outcome-Based Education & AI Assessment Suite
              </span>
            </div>

            {/* Tab Navigation */}
            <div className="flex items-center gap-1 bg-slate-800 p-1 rounded-xl text-xs font-semibold">
              <button
                onClick={() => setActiveTab("builder")}
                className={`px-4 py-2 rounded-lg transition-all ${
                  activeTab === "builder" ? "bg-indigo-600 text-white shadow" : "text-slate-400 hover:text-white"
                }`}
              >
                1. Quiz Builder & Gate
              </button>
              <button
                onClick={() => setActiveTab("bank")}
                className={`px-4 py-2 rounded-lg transition-all ${
                  activeTab === "bank" ? "bg-indigo-600 text-white shadow" : "text-slate-400 hover:text-white"
                }`}
              >
                2. Question Bank Approval
              </button>
              <button
                onClick={() => setActiveTab("obe")}
                className={`px-4 py-2 rounded-lg transition-all ${
                  activeTab === "obe" ? "bg-indigo-600 text-white shadow" : "text-slate-400 hover:text-white"
                }`}
              >
                3. HEC OBE Dashboard & Dossier
              </button>
            </div>

            {/* Quick Session Controls */}
            <div className="flex items-center gap-3">
              <button
                onClick={autoLoginProfessor}
                disabled={loginLoading}
                className="text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg font-medium transition-all"
              >
                {token ? "Token Active \u2713" : loginLoading ? "Connecting..." : "Auto-Login Faculty"}
              </button>
            </div>
          </nav>

          {/* Tab Views */}
          <div className="flex-1">
            {activeTab === "builder" && <QuizBuilderView courseId={courseId} />}
            {activeTab === "bank" && <QuestionBankView courseId={courseId} />}
            {activeTab === "obe" && <OBEDashboardView courseId={courseId} />}
          </div>
        </div>
      );
    }

    // Embed QuestionBankPage
    function QuestionBankView({ courseId }) {
      return (
        <div className="p-4 max-w-7xl mx-auto">
          <iframe
            src="/static_assets/react/question_bank.html"
            className="w-full h-[850px] border-0 rounded-xl shadow-sm"
          />
        </div>
      );
    }

    // Embed QuizBuilderPage
    function QuizBuilderView({ courseId }) {
      return (
        <div className="p-4 max-w-7xl mx-auto">
          <iframe
            src="/static_assets/react/quiz_builder.html"
            className="w-full h-[880px] border-0 rounded-xl shadow-sm"
          />
        </div>
      );
    }

    // Embed OBEDashboardPage
    function OBEDashboardView({ courseId }) {
      return (
        <div className="p-4 max-w-7xl mx-auto">
          <iframe
            src="/static_assets/react/obe_dashboard.html"
            className="w-full h-[880px] border-0 rounded-xl shadow-sm"
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
